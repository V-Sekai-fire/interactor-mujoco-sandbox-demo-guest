name: release


on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: V-Sekai-fire/contract-guest-runtime
          path: contract-guest-runtime
      - name: Get libriscv from the godot-sandbox fork
        run: git clone --recursive --depth 1 https://github.com/V-Sekai-fire/godot-sandbox godot-sandbox
      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          manifest-path: tools/toolchain/pixi.toml
      - name: Build the guest ELF and the node
        run: |
          mkdir -p dist
          pixi run --manifest-path tools/toolchain/pixi.toml bash -c '
            set -e
            elixir tools/build_guest.exs --llvm-bin "$CONDA_PREFIX/bin" --sandbox-api contract-guest-runtime/vendor/sandbox-api --out dist/mujoco.human.double.elf
            elixir tools/build_cnode.exs --libriscv godot-sandbox/ext/libriscv --out build-cnode
            cp build-cnode/mujoco_cnode dist/mujoco_cnode-linux-x86_64
          '
          (cd dist && sha256sum * > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: mujoco-guest
          path: dist/
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
